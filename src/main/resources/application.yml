spring:
  application:
    name: siase-billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_billing_db}
    username: ${DB_USER:siase_user}
    password: ${DB_PASSWORD:siase_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNA==}

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    queue-url-billing: ${SQS_BILLING_URL}
    queue-url-os-updates: ${SQS_OS_UPDATES_URL}
    queue-url-execution: ${SQS_EXECUTION_URL}
    poll-interval-ms: ${SQS_POLL_INTERVAL_MS:5000}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  notification-url: ${BILLING_PUBLIC_URL}/api/billing/webhook/mercadopago
  success-url: ${PORTAL_URL:http://localhost:4200}/pagamento/sucesso
  failure-url: ${PORTAL_URL:http://localhost:4200}/pagamento/falha

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8092}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.fiap.siase: INFO
