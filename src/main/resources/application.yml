server:
  port: 8082

spring:
  application:
    name: siase-billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_billing_db}
    username: ${DB_USER:siase_billing_user}
    password: ${DB_PASSWORD:siase_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  springdoc:
    swagger-ui:
      path: /api/swagger-ui.html
    api-docs:
      path: /api/v3/api-docs

app:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}
  sqs:
    billing-url: ${SQS_BILLING_URL:http://localhost:4566/000000000000/siase-billing-queue}
    os-updates-url: ${SQS_OS_UPDATES_URL:http://localhost:4566/000000000000/siase-os-updates-queue}
    poll-delay-ms: ${SQS_POLL_DELAY_MS:5000}
  billing:
    public-url: ${BILLING_PUBLIC_URL:http://localhost:8082}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    mock: ${MERCADOPAGO_MOCK:true}    # true em dev — desligar em prod
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:prod}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: info
