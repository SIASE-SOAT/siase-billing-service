apiVersion: apps/v1
kind: Deployment
metadata:
  name: siase-billing-service
  labels:
    app: siase-billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siase-billing-service
  template:
    metadata:
      labels:
        app: siase-billing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: siase-billing-service
          image: ECR_REGISTRY/IMAGE_NAME:IMAGE_TAG
          ports:
            - containerPort: 8082
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: siase-billing-service-db, key: host } }
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: siase_billing_db
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: siase-billing-service-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: siase-billing-service-db, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: siase-jwt, key: secret } }
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: siase-mercadopago, key: access-token } }
            - name: MERCADOPAGO_MOCK
              value: "false"
            - name: BILLING_PUBLIC_URL
              value: "https://billing.siase.example.com"   # URL pública p/ webhook MP
            - name: AWS_REGION
              value: us-east-1
            - name: SQS_BILLING_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: billing-url } }
            - name: SQS_OS_UPDATES_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: os-updates-url } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: siase-billing-service
spec:
  selector:
    app: siase-billing-service
  ports:
    - port: 80
      targetPort: 8082
